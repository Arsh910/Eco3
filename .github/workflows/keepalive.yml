name: keepalive

on:
  schedule:
    - cron: '*/11 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          sleep $((RANDOM % 120))
          curl -fsS --max-time 60 https://ecoos3.onrender.com/api/v1/health || true